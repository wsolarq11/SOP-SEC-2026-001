name: SOP Publish Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lark-cli
        run: npm install -g @larksuite/cli@1.0.86

      - name: Restore publish tokens
        shell: pwsh
        env:
          TOKENS_B64: ${{ secrets.PUBLISH_TOKENS_B64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:TOKENS_B64)
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE '.publish-tokens'), $bytes)

      - name: Validate and build docx
        shell: bash
        env:
          PY: python
          PUB: ${{ runner.temp }}\sop-exports\publish
        run: bash output/sop-system-20260812/stage3/publish.sh --dry-run

      - name: Publish docx to Feishu
        shell: pwsh
        env:
          APP_ID: ${{ secrets.LARK_APP_ID }}
          APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          PY: python
          AS: bot
          PUB: ${{ runner.temp }}\sop-exports\publish
        run: |
          if ([string]::IsNullOrEmpty($env:APP_ID) -or [string]::IsNullOrEmpty($env:APP_SECRET)) {
            Write-Host 'Skipping Feishu publish: LARK_APP_ID/LARK_APP_SECRET not configured.'
            exit 0
          }
          $env:APP_SECRET | lark-cli config init --app-id $env:APP_ID --app-secret-stdin --brand feishu
          bash output/sop-system-20260812/stage3/publish.sh
