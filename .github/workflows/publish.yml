name: SOP Publish Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install lark-cli
        run: npm install -g @larksuite/cli@1.0.87

      - name: Restore publish tokens
        shell: pwsh
        env:
          TOKENS_B64: ${{ secrets.PUBLISH_TOKENS_B64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:TOKENS_B64)
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE '.publish-tokens'), $bytes)

      - name: Scan secrets
        shell: pwsh
        run: python tools/kb.py secrets --all

      - name: Validate, build and publish
        shell: pwsh
        env:
          APP_ID: ${{ secrets.LARK_APP_ID }}
          APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          PY: python
          AS: bot
          PUB: ${{ runner.temp }}/sop-exports/publish
        run: |
          if ([string]::IsNullOrEmpty($env:APP_ID) -or [string]::IsNullOrEmpty($env:APP_SECRET)) {
            Write-Host 'LARK_APP_ID/LARK_APP_SECRET not configured; validating only.'
            python tools/kb.py publish --dry-run
            exit 0
          }
          $env:APP_SECRET | lark-cli config init --app-id $env:APP_ID --app-secret-stdin --brand feishu
          python tools/kb.py publish

      - name: Commit publish facts
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sops/publish-history.jsonl sops/registry.json sops/REGISTRY.md
          if (git diff --cached --quiet) {
            Write-Host 'No publish facts changed.'
            exit 0
          }
          git commit -m "chore(publish): record publish facts"
          $repo = $env:GITHUB_REPOSITORY
          $token = $env:GH_TOKEN
          git remote set-url origin "https://x-access-token:${token}@github.com/${repo}.git"
          git push origin HEAD:master

      - name: Report production line
        if: always()
        shell: pwsh
        env:
          PUB: ${{ runner.temp }}/sop-exports/publish
        run: python tools/kb.py line --json

      - name: Archive publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: |
            ${{ runner.temp }}/sop-exports/publish/publish-log.jsonl
            sops/publish-history.jsonl
          if-no-files-found: warn
